name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked environment
        run: uv sync --frozen --all-extras

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Run the CLI smoke flow
        run: |
          uv run agent-security-evals list
          uv run agent-security-evals \
            --data-dir "$RUNNER_TEMP/data" \
            prepare smoke
          uv run agent-security-evals \
            --data-dir "$RUNNER_TEMP/data" \
            run smoke \
            --adapter _self-test \
            --output "$RUNNER_TEMP/run"
          uv run agent-security-evals compare \
            "$RUNNER_TEMP/run" \
            "$RUNNER_TEMP/run" \
            --output "$RUNNER_TEMP/comparison"

      - name: Build the wheel
        if: matrix.python-version == '3.13'
        run: uv build

      - name: Test the installed wheel
        if: matrix.python-version == '3.13'
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" \
            --python "${{ matrix.python-version }}"
          uv pip install \
            --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/agent-security-evals" \
            --data-dir "$RUNNER_TEMP/wheel-data" \
            prepare smoke
          "$RUNNER_TEMP/wheel-venv/bin/python" -c \
            "from importlib.resources import files; root = files('agent_security_evals'); assert (root / 'data/llmail_core.jsonl').is_file(); assert (root / 'data/third_party/llmail/LICENSE-MIT').is_file()"
