[project]
name = "agent-shell-corpus"
version = "0.1.0"
description = "Local corpus checks for OpenHands security analyzers"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=23,<24",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.14,<0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
